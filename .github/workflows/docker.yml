name: Docker

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          #- version: "3.1"
          #- version: "3.2"
          #- version: "3.3"
          #- version: "3.4"
          #- version: "3.5"
          #- version: "3.6"
          - version: "3.7"
          - version: "3.8"
          - version: "3.9"
          - version: "3.10"
          - version: "3.11"
          - version: "3.12"
          - version: "3.13"
          - version: "3.14"
          - version: "3.15"
          - version: "3.16"
          - version: "3.17"
          - version: "3.18"
          - version: "3.19"
          - version: "3.20"
          - version: "3.21"
          - version: "3.22"
          - version: "3.23"
          - version: "3.24"
          - version: "edge"

      fail-fast: false

    name: Docker (dockette/alpine:${{ matrix.version }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.version  }}
          push: true
          tags: dockette/alpine:${{ matrix.version }}
          platforms: linux/amd64,linux/arm64
